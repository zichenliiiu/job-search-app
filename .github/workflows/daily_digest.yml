name: Daily Job Digest

on:
  schedule:
    - cron: '0 13 * * *'  # 6:00am San Francisco (PDT, UTC-7)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail credential files
        run: |
          echo "$GMAIL_TOKEN_JSON" | tr -d '\n' | base64 --decode > config/token.json
          echo "$GMAIL_CREDENTIALS_JSON" | tr -d '\n' | base64 --decode > config/credentials.json
          echo "token.json: $(wc -c < config/token.json) bytes"
          echo "credentials.json: $(wc -c < config/credentials.json) bytes"
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}

      - name: Run digest pipeline
        run: python run_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CREDENTIALS_PATH: config/credentials.json
          GMAIL_TOKEN_PATH: config/token.json
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
